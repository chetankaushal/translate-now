name: Android Emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.movil.translatenow
  EXPO_PUBLIC_TRANSLATION_PROVIDER: mock

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Without this the emulator falls back to software rendering and the
      # job takes ~4x longer, often timing out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No `cache: npm` — it hard-fails when no lockfile is present.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Environment report
        run: |
          echo "node  $(node -v)"
          echo "npm   $(npm -v)"
          echo "java  $(java -version 2>&1 | head -1)"
          echo "lockfile present: $([ -f package-lock.json ] && echo yes || echo NO)"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json committed. Falling back to npm install."
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_APP_ID: ${{ env.BUNDLE_ID }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/ --format junit --output maestro-android.xml

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # upload-artifact does NOT expand `~`.
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-results
          path: |
            maestro-android.xml
            /home/runner/.maestro/tests/
          if-no-files-found: warn
          retention-days: 14
